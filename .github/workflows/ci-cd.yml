name: CI and demo deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Test without optional frameworks
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked pytest -q
      - name: Test with CPU YOLO and Qwen dependencies (no weights or paid calls)
        working-directory: backend
        run: |
          uv sync --locked --extra yolo --extra qwen
          uv run --locked --extra yolo --extra qwen pytest -q
      - name: Validate release scripts
        run: |
          bash -n backend/deploy/release.sh
          shellcheck backend/deploy/release.sh
          python backend/deploy/test_release.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  package:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Package only runtime source and tested frontend
        run: |
          tar -czf release.tar.gz backend/app backend/pyproject.toml backend/uv.lock backend/models.json frontend/dist
          sha256sum release.tar.gz > release.tar.gz.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: pcb-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Skip obsolete main revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; skipping this deployment.'
          fi
      - uses: actions/download-artifact@v8.0.1
        if: steps.revision.outputs.current == 'true'
        with:
          name: release
          path: artifact
      - name: Upload and activate release
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          port=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd artifact
          sha256sum -c release.tar.gz.sha256
          checksum=$(cut -d ' ' -f1 release.tar.gz.sha256)
          scp "${ssh_options[@]}" -P "$port" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/pcb/incoming/$release_id.tar.gz"
          ssh "${ssh_options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$release_id' '$checksum'" < ../backend/deploy/release.sh

# Install as /etc/nginx/sites-available/pcb; replace demo.example.com and certificate paths.
server {
    listen 80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    auth_basic "PCB demo";
    auth_basic_user_file /etc/nginx/pcb.htpasswd;
    client_max_body_size 11m;
    root /opt/pcb/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

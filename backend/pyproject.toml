[project]
name = "pcb-inference"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pillow>=11,<13", "python-multipart>=0.0.20", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3,<9", "torch==2.8.0", "torchvision==0.23.0"]
qwen = ["dashscope>=1.27,<2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
